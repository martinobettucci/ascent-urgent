<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56677F"/></marker></defs><rect width="1200" height="600" fill="#FFFFFF"/><text x="36" y="42.0" fill="#23468C" font-family="DejaVu Sans" font-size="21" font-weight="700" text-anchor="start">MÉCANISME • LE PARTAGE DES POIDS RÉDUIT LES PARAMÈTRES</text><rect x="65" y="118" width="495" height="180" rx="14" fill="#23468C" stroke="none" stroke-width="2"/><text x="312.5" y="198.07999999999998" fill="#FFFFFF" font-family="DejaVu Sans" font-size="31" font-weight="700" text-anchor="middle">Convolution :</text><text x="312.5" y="239.0" fill="#FFFFFF" font-family="DejaVu Sans" font-size="31" font-weight="700" text-anchor="middle">(3 × 3 × 1 + 1) × 8 = 80</text><rect x="635" y="118" width="495" height="180" rx="14" fill="#238C33" stroke="none" stroke-width="2"/><text x="882.5" y="198.07999999999998" fill="#FFFFFF" font-family="DejaVu Sans" font-size="31" font-weight="700" text-anchor="middle">Dense :</text><text x="882.5" y="239.0" fill="#FFFFFF" font-family="DejaVu Sans" font-size="31" font-weight="700" text-anchor="middle">64 × 32 + 32 = 2 080</text><text x="600" y="389.0" fill="#56677F" font-family="DejaVu Sans" font-size="27" font-weight="700" text-anchor="middle">Comparer aussi les sorties et les opérations.</text><text x="600" y="447.0" fill="#56677F" font-family="DejaVu Sans" font-size="23" font-weight="400" text-anchor="middle">Moins de paramètres n’est pas une preuve automatique de qualité.</text><line x1="30" y1="557" x2="1170" y2="557" stroke="#CDD8E6" stroke-width="1"/><text x="32" y="584.0" fill="#56677F" font-family="DejaVu Sans" font-size="16" font-weight="400" text-anchor="start">Schéma pédagogique • valeurs d’illustration, sauf indication contraire</text><text x="1166" y="584.0" fill="#23468C" font-family="DejaVu Sans" font-size="16" font-weight="400" text-anchor="end">https://p2enjoy.studio</text></svg>